  .modal-confirm-icon.info{background:var(--ag-green-soft);color:var(--ag-green);}
  .modal-confirm-icon svg{width:26px;height:26px;}
  .modal-confirm h3{margin:0 0 6px;font-size:17px;color:var(--ag-gray-900);}
  .modal-confirm p{margin:0 0 20px;font-size:13.5px;color:var(--ag-gray-600);line-height:1.5;}
  .modal-confirm-actions{display:flex;gap:10px;justify-content:center;}
  .modal-confirm-actions .btn{min-width:110px;}

  /* View (detail) rows — tightened spacing + subtle row fade-in so the popup reads as
     instantly populated rather than a slow static block of text. */
  .detail-row{display:flex;padding:10px 0;border-bottom:1px solid var(--ag-gray-100);font-size:13.5px;animation:detail-row-in .22s ease backwards;}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{width:140px;flex-shrink:0;color:var(--ag-gray-900);font-weight:600;}
  .detail-value{color:var(--ag-gray-900);}
  /* Detail rows nested inside a po-cart-section card (e.g. Review PO "Detail Pengajuan")
     use a lighter divider so they read as part of the card, not a separate dense list. */
  .po-cart-section .detail-row{padding:8px 0;border-bottom-color:var(--ag-gray-200);font-size:13px;}
  .po-cart-section .detail-label{width:150px;color:var(--ag-gray-600);font-weight:600;}
  .po-cart-section .detail-value{font-weight:600;}
  .detail-image{width:120px;height:120px;object-fit:cover;border-radius:14px;border:1px solid var(--ag-gray-200);margin:0 auto 16px;display:block;box-shadow:var(--shadow-sm);}
  @keyframes detail-row-in{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}

  /* ---------- Agent detail modal (modern layout) ---------- */
  .agent-detail-head{
    display:flex;align-items:center;gap:14px;padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--ag-gray-100);
  }
  .agent-detail-avatar{
    width:52px;height:52px;border-radius:14px;background:var(--ag-green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex-shrink:0;
  }
  .agent-detail-name{font-size:16px;font-weight:800;color:var(--ag-gray-900);line-height:1.25;}
  .agent-detail-id{font-size:12px;color:var(--ag-gray-600);font-weight:600;margin-top:1px;}
  .agent-detail-head-meta{min-width:0;flex:1;}
  .agent-detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

  .agent-detail-section-title{
    font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ag-gray-400);
    margin:20px 0 10px;
  }
  .agent-detail-section-title:first-of-type{margin-top:0;}

  .agent-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;}
  .agent-detail-field{padding:9px 0;border-bottom:1px solid var(--ag-gray-100);}
  .agent-detail-field.full{grid-column:1 / -1;}
  .agent-detail-field-label{font-size:11px;color:var(--ag-gray-600);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .agent-detail-field-value{font-size:13.5px;color:var(--ag-gray-900);font-weight:600;line-height:1.4;}

  /* Commission amount highlight — the single most important figure in Detail Komisi,
     pulled out of the grid into its own quiet green card so it reads instantly instead
     of blending into a wall of label/value rows. */
  .commission-amount-card{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--ag-green-soft);border-radius:14px;padding:14px 16px;margin-bottom:16px;
  }
  .commission-amount-label{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ag-green);}
  .commission-amount-sub{font-size:11.5px;color:var(--ag-gray-600);margin-top:2px;}
  .commission-amount-value{font-size:22px;font-weight:800;color:var(--ag-green);letter-spacing:-.01em;white-space:nowrap;}

  /* Ringkasan "Bayarkan Komisi Ini?" — kartu konteks di dalam modal konfirmasi bayar
     (payCommissionAction), supaya staff lihat jelas SIAPA penerima & BERAPA nominalnya
     sebelum mengisi bukti transfer, bukan cuma judul modal generik tanpa data. */
  .commission-pay-summary{
    background:var(--ag-gray-50);border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);
    padding:14px 16px;
  }
  .commission-pay-summary-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;}
  .commission-pay-summary-row + .commission-pay-summary-row{border-top:1px solid var(--ag-gray-200);}
  .commission-pay-summary-label{font-size:11.5px;color:var(--ag-gray-600);font-weight:600;}
  .commission-pay-summary-value{font-size:13px;font-weight:700;color:var(--ag-gray-800);text-align:right;}
  .commission-pay-summary-amount{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:10px;padding-top:12px;border-top:1px dashed var(--ag-gray-300);
  }
  .commission-pay-summary-amount span:first-child{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ag-green);}
  .commission-pay-summary-amount-value{font-size:22px;font-weight:800;color:var(--ag-green);letter-spacing:-.01em;}

  /* Commission flow stepper — menampilkan alur ELIGIBLE -> CLAIMED -> VERIFIED -> PAID
     supaya user (terutama Admin) paham siapa mengerjakan step berikutnya, dan tidak
     bingung saat tidak ada tombol aksi untuk role mereka di status tertentu. */
  .commission-flow{display:flex;align-items:flex-start;gap:0;padding:16px 18px;background:var(--ag-white);
    border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);margin-bottom:16px;overflow-x:auto;}
  .commission-flow-step{display:flex;align-items:flex-start;gap:0;flex:1;min-width:120px;}
  .commission-flow-step:last-child{flex:0 0 auto;min-width:0;}
  .commission-flow-node{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:132px;text-align:center;}
  .commission-flow-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:var(--ag-gray-100);color:var(--ag-gray-500);border:2px solid var(--ag-gray-200);
    flex-shrink:0;transition:background .15s,color .15s,border-color .15s;}
  .commission-flow-dot svg{width:15px;height:15px;}
  /* Warna dot/label/connector per-step (biru=Eligible, oranye=Diklaim, ungu=Terverifikasi,
     hijau=Dibayar) SENGAJA disamakan dengan warna kartu KPI Commission di atasnya — baik saat
     step itu jadi tahap SAAT INI (is-current) maupun sudah TERLEWATI (is-done), supaya warna
     "Eligible" konsisten biru di mana pun ditampilkan, bukan berubah jadi hijau begitu step
     berikutnya tercapai. */
  .commission-flow-step.step-blue .commission-flow-dot{background:var(--ag-blue);border-color:var(--ag-blue);color:#fff;}
  .commission-flow-step.step-orange .commission-flow-dot{background:var(--ag-orange);border-color:var(--ag-orange);color:#fff;}
  .commission-flow-step.step-purple .commission-flow-dot{background:var(--ag-purple);border-color:var(--ag-purple);color:#fff;}
  .commission-flow-step.step-green .commission-flow-dot{background:var(--ag-green);border-color:var(--ag-green);color:#fff;}
  .commission-flow-step.is-current .commission-flow-dot{box-shadow:0 0 0 4px var(--ag-blue-soft);}
  .commission-flow-step.is-current.step-blue .commission-flow-dot{box-shadow:0 0 0 4px var(--ag-blue-soft);}
  .commission-flow-step.is-current.step-orange .commission-flow-dot{box-shadow:0 0 0 4px var(--ag-orange-soft);}
  .commission-flow-step.is-current.step-purple .commission-flow-dot{box-shadow:0 0 0 4px var(--ag-purple-soft);}
  .commission-flow-step.is-current.step-green .commission-flow-dot{box-shadow:0 0 0 4px var(--ag-green-soft);}
  .commission-flow-label{font-size:11.5px;font-weight:700;color:var(--ag-gray-800);margin-top:8px;}
  .commission-flow-step.step-blue .commission-flow-label{color:var(--ag-blue);}
  .commission-flow-step.step-orange .commission-flow-label{color:var(--ag-orange);}
  .commission-flow-step.step-purple .commission-flow-label{color:var(--ag-purple);}
  .commission-flow-step.step-green .commission-flow-label{color:var(--ag-green);}
  .commission-flow-who{font-size:10.5px;color:var(--ag-gray-500);margin-top:1px;}
  .commission-flow-connector{flex:1;height:2px;background:var(--ag-gray-200);margin-top:15px;min-width:16px;transition:background .15s;}
  .commission-flow-connector.step-blue{background:var(--ag-blue);}
  .commission-flow-connector.step-orange{background:var(--ag-orange);}
  .commission-flow-connector.step-purple{background:var(--ag-purple);}
  .commission-flow-connector.step-green{background:var(--ag-green);}
  .commission-flow-hint{margin-top:10px;padding:9px 12px;background:var(--ag-blue-soft);color:var(--ag-blue);
    border-radius:var(--radius-sm);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .commission-flow-hint svg{width:15px;height:15px;flex-shrink:0;}
  .commission-flow-hint.is-done{background:var(--ag-green-soft);color:var(--ag-green);}
  @media (max-width:640px){
    .commission-flow{padding:14px 12px;}
    .commission-flow-node{width:88px;}
    .commission-flow-label{font-size:10.5px;}
    .commission-flow-who{display:none;}
  }

  /* Document preview grid */
  .doc-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
  .doc-preview-card{
    display:block;border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);overflow:hidden;
    background:var(--ag-surface);text-decoration:none;transition:border-color .15s, box-shadow .15s, transform .15s;position:relative;
  }
  .doc-preview-card:hover{border-color:var(--ag-green);box-shadow:var(--shadow-sm);transform:translateY(-2px);}
  .doc-preview-thumb{
    width:100%;height:92px;background:var(--ag-gray-50);display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .doc-preview-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .doc-preview-thumb .doc-preview-fallback{color:var(--ag-gray-400);width:30px;height:30px;}
  .doc-preview-thumb .doc-preview-fallback svg{width:100%;height:100%;}
  .doc-preview-overlay{
    position:absolute;inset:0;background:rgba(11,61,46,.55);display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s;color:#fff;
  }
  .doc-preview-card:hover .doc-preview-overlay{opacity:1;}
  .doc-preview-overlay svg{width:20px;height:20px;}
  .doc-preview-label{
    padding:8px 10px;font-size:11.5px;font-weight:700;color:var(--ag-gray-900);
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .doc-preview-edit-btn{
    position:absolute;top:6px;right:6px;z-index:4;width:24px;height:24px;border-radius:50%;border:none;
    background:var(--ag-surface);color:var(--ag-green);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s, color .15s;
  }
  .doc-preview-edit-btn:hover{background:var(--ag-green);color:#fff;}
  .doc-preview-edit-btn svg{width:12px;height:12px;}
  .doc-preview-delete-btn{
    position:absolute;top:6px;right:34px;z-index:4;width:24px;height:24px;border-radius:50%;border:none;
    background:var(--ag-surface);color:var(--ag-red,#D64545);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s, color .15s;
  }
  .doc-preview-delete-btn:hover{background:var(--ag-red,#D64545);color:#fff;}
  .doc-preview-delete-btn svg{width:12px;height:12px;}
  .doc-preview-lock-badge{
    position:absolute;top:6px;right:6px;z-index:4;width:24px;height:24px;border-radius:50%;
    background:rgba(17,24,39,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:help;
  }
  .doc-preview-lock-badge svg{width:11px;height:11px;}
  .doc-locked-note{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ag-gray-500);
    margin:8px 0 18px;
  }
  .doc-locked-note svg{width:13px;height:13px;flex-shrink:0;color:var(--ag-gray-400);}
  .doc-preview-empty{
    grid-column:1/-1;text-align:center;padding:22px 10px;color:var(--ag-gray-400);font-size:12.5px;
    border:1.5px dashed var(--ag-gray-200);border-radius:var(--radius-md);
  }
  .doc-group-label{
    font-size:11px;color:var(--ag-gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    margin:14px 0 8px;display:flex;align-items:center;gap:6px;
  }
  .doc-group-label:first-of-type{margin-top:0;}
  .doc-group-label .po-cart-count{font-size:10px;}

  /* Order detail modal — compact summary header + status pill row */
  .order-summary-head{display:flex;flex-direction:column;gap:12px;margin-bottom:4px;}
  .order-summary-head-top{display:flex;align-items:flex-start;gap:14px;}
  .order-summary-icon{
    width:42px;height:42px;border-radius:var(--radius-md);background:var(--ag-green-soft);color:var(--ag-green);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .order-summary-icon svg{width:22px;height:22px;}
  .order-summary-title{font-size:15px;font-weight:800;color:var(--ag-gray-900);}
  .order-summary-sub{font-size:12px;color:var(--ag-gray-500);margin-top:1px;}
  .order-summary-badges{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;}

  /* Detail Produk modal — photo + name/category/status header, same family as order-summary */
  .product-summary-head{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
  .product-summary-photo{
    width:64px;height:64px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0;
    background:var(--ag-gray-50);border:1px solid var(--ag-gray-200);display:flex;align-items:center;justify-content:center;
  }
  .product-summary-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-summary-photo-empty{width:26px;height:26px;color:var(--ag-gray-300);}
  .product-summary-photo-empty svg{width:100%;height:100%;}
  .product-summary-title{font-size:15px;font-weight:800;color:var(--ag-gray-900);}
  .product-summary-sub{font-size:12px;color:var(--ag-gray-500);margin-top:1px;}
  .product-summary-badges{margin-top:6px;}

  /* Document card used for Surat Jalan / Detail Order (PDF, no image thumb) */
  .doc-preview-card-pdf .doc-preview-thumb{background:var(--ag-gray-50);}
  .doc-preview-card-pdf .doc-preview-fallback{color:var(--ag-green);}

  /* Lightbox for full document preview. z-index 300: HARUS lebih tinggi dari .modal-overlay
     (250), karena lightbox ini dibuka DARI DALAM modal lain (mis. klik ikon zoom pada dokumen
     MOU di popup "Detail Agent") — kalau lebih rendah/sama, lightbox-nya render di belakang
     modal yang membukanya dan terlihat seolah tidak muncul sama sekali. */
  .doc-lightbox-overlay{
    position:fixed;inset:0;background:rgba(15,23,20,.82);z-index:300;
    display:none;align-items:center;justify-content:center;padding:30px;
  }
  .doc-lightbox-overlay.show{display:flex;}
  .doc-lightbox-box{max-width:min(720px,92vw);max-height:88vh;background:var(--ag-surface);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-md);}
  .doc-lightbox-header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ag-gray-100);}
  .doc-lightbox-title{font-size:14px;font-weight:800;color:var(--ag-gray-900);}
  .doc-lightbox-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .doc-lightbox-body{padding:0;background:var(--ag-gray-50);display:flex;align-items:flex-start;justify-content:center;overflow:auto;flex:1;min-height:200px;}
  .doc-lightbox-body img{max-width:100%;height:auto;display:block;margin:0 auto;}
  .doc-lightbox-close{
    background:var(--ag-gray-100);border:none;width:30px;height:30px;border-radius:50%;color:var(--ag-gray-600);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .doc-lightbox-close:hover{background:var(--ag-red);color:#fff;}
  .doc-lightbox-open-link{
    font-size:12px;font-weight:700;color:var(--ag-green);text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  }
  .doc-lightbox-open-link svg{width:14px;height:14px;}
  .doc-lightbox-box-pdf{width:min(880px,92vw);height:min(88vh,900px);max-width:880px;}
  .doc-lightbox-box-pdf .doc-lightbox-body{padding:0;background:var(--ag-gray-100);}
  .doc-lightbox-frame{width:100%;height:100%;border:none;display:block;min-height:70vh;}

  /* Product picker (Agent side) */
  .product-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .product-pick-card{border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);padding:10px;cursor:pointer;transition:border-color .15s, box-shadow .15s;background:var(--ag-surface);}
  .product-pick-card:hover{border-color:var(--ag-green);box-shadow:var(--shadow-sm);}
  .product-pick-card.selected{border-color:var(--ag-green);background:var(--ag-green-soft);}
  .product-pick-thumb{width:100%;height:90px;object-fit:cover;border-radius:var(--radius-sm);background:var(--ag-gray-100);margin-bottom:8px;}
  .product-pick-name{font-size:12.5px;font-weight:700;color:var(--ag-gray-900);line-height:1.3;}
  .product-pick-meta{font-size:11px;color:var(--ag-gray-600);margin-top:2px;}

  /* ---------- Image upload widget ---------- */
  .img-upload{
    border:1.5px dashed var(--ag-gray-200);border-radius:14px;
    padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;
    position:relative;background:var(--ag-gray-50);margin-bottom:18px;
  }
  .img-upload:hover{border-color:var(--ag-green);background:var(--ag-green-soft);}
  .img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:1;}
  .img-upload-preview{width:96px;height:96px;object-fit:cover;border-radius:12px;margin:0 auto 10px;display:block;border:1px solid var(--ag-gray-200);box-shadow:var(--shadow-sm);}
  .img-upload-placeholder{width:40px;height:40px;margin:0 auto 10px;color:var(--ag-gray-400);}
  .img-upload-placeholder svg{width:100%;height:100%;}
  .img-upload-text{font-size:13px;color:var(--ag-green);font-weight:700;}
  .img-upload-sub{font-size:11px;color:var(--ag-gray-400);margin-top:3px;}
  .img-upload-remove{
    display:block;text-align:center;margin:-12px 0 16px;font-size:11.5px;color:var(--ag-red);cursor:pointer;font-weight:600;
    position:relative;z-index:2;
  }

  /* ---------- Editable scheme / small CRUD table rows ---------- */
  .table-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .table-toolbar .card-title{margin-right:auto;}

  /* ---------- List header (title + primary action) used on Promo, dst ----------
     Dibuat terpisah dari .table-toolbar supaya tombol aksi utama punya tap-target
     yang jelas & tidak pernah "diserobot" elemen lain: position:relative + z-index
     memastikan tombol selalu di lapisan paling atas & seluruh area tombol (ikon
     MAUPUN teks) bisa diklik/di-tap, bukan cuma ikonnya. */
  .list-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;position:relative;z-index:3;}
  .list-header .card-title{margin-right:auto;}
  .list-header-btn{position:relative;z-index:3;min-height:36px;padding:8px 16px 8px 14px;}
  .list-header-btn .btn-icon{display:inline-flex;pointer-events:none;}
  .list-header-btn span{pointer-events:none;}
  @media (max-width: 480px){
    .list-header-btn{padding:8px 12px;font-size:12.5px;}
  }
  .data-table td input, .data-table td select{
    width:100%;padding:6px 8px;border:1px solid var(--ag-gray-200);border-radius:6px;font-size:13px;
  }
  .inline-actions{display:flex;gap:6px;}

  /* ---------- Filter bar (search + dropdown filters used across list pages) ---------- */
  .filter-bar{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:12px 14px;margin:14px 0 16px;
    background:var(--ag-gray-50);border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);
  }
  .filter-search{
    position:relative;flex:1 1 220px;min-width:180px;max-width:320px;
  }
  .filter-search input{
    width:100%;padding:8px 12px 8px 34px;border:1px solid var(--ag-gray-200);border-radius:999px;
    font-size:13px;background:var(--ag-surface);color:var(--ag-gray-900);transition:border-color .12s ease, box-shadow .12s ease;
  }
  .filter-search input::placeholder{color:var(--ag-gray-400);opacity:1;}
  .filter-search input:focus{outline:none;border-color:var(--ag-green);box-shadow:0 0 0 3px var(--ag-green-soft);}
  .filter-search-icon{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ag-gray-400);
    width:15px;height:15px;pointer-events:none;display:flex;
  }
  .filter-search-icon svg{width:15px;height:15px;}
  .filter-search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
    display:none;align-items:center;justify-content:center;color:var(--ag-gray-400);cursor:pointer;background:var(--ag-gray-100);
  }
  .filter-search-clear:hover{background:var(--ag-gray-200);color:var(--ag-gray-600);}
  .filter-search-clear svg{width:10px;height:10px;}
  .filter-search.has-value .filter-search-clear{display:flex;}
  .filter-select-wrap{position:relative;flex:0 0 auto;}
  .filter-select{
    appearance:none;-webkit-appearance:none;padding:8px 30px 8px 13px;border:1px solid var(--ag-gray-200);
    border-radius:999px;font-size:13px;font-weight:600;color:var(--ag-gray-700);background:var(--ag-surface);
    cursor:pointer;transition:border-color .12s ease, color .12s ease;max-width:220px;text-overflow:ellipsis;
  }
  .filter-select:hover{border-color:var(--ag-gray-400);}
  .filter-select:focus{outline:none;border-color:var(--ag-green);box-shadow:0 0 0 3px var(--ag-green-soft);}
  .filter-select.active{background:var(--ag-green-soft);border-color:var(--ag-green);color:var(--ag-green);}
  .filter-select-wrap::after{
    content:'';position:absolute;right:12px;top:50%;width:7px;height:7px;pointer-events:none;
    border-right:1.6px solid var(--ag-gray-400);border-bottom:1.6px solid var(--ag-gray-400);
    transform:translateY(-65%) rotate(45deg);
  }
  .filter-select-wrap:has(.filter-select.active)::after{border-color:var(--ag-green);}
  .filter-daterange{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .filter-daterange input[type=date]{
    padding:7px 12px;font-size:13px;color:var(--ag-gray-700);font-weight:600;
  }
  .filter-daterange-sep{color:var(--ag-gray-400);font-size:11px;}
  .filter-reset-btn{
    display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;border:1px solid transparent;
    font-size:12.5px;font-weight:600;color:var(--ag-red);background:transparent;cursor:pointer;flex:0 0 auto;
    transition:background .12s ease;
  }
  .filter-reset-btn svg{width:13px;height:13px;}
  .filter-reset-btn:hover{background:var(--ag-red-soft);}
  .filter-reset-btn--hidden{visibility:hidden;pointer-events:none;}
  .filter-count-pill{
    flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ag-gray-600);background:var(--ag-surface);
    border:1px solid var(--ag-gray-200);padding:6px 12px;border-radius:999px;margin-left:auto;
  }
  .filter-count-pill b{color:var(--ag-green);}
  @media (max-width: 720px){
    /* Search selalu full-width sendiri; sisanya (dropdown, reset, counter) dikelompokkan
       dalam .filter-controls-row supaya presisi satu baris yang sama & tidak makan baris
       ekstra terpisah-pisah seperti sebelumnya. */
    .filter-bar{padding:9px 10px;gap:7px;margin:10px 0 14px;flex-direction:column;align-items:stretch;}
    .filter-search{max-width:none;flex:0 0 auto;}
    .filter-controls-row{flex-wrap:wrap;}
    .filter-select-wrap{flex:1 1 140px;}
    .filter-select{width:100%;max-width:none;}
    .filter-count-pill{margin-left:auto;}
  }
  .filter-controls-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;}

  /* ---------- Date field dgn ikon kalender dekoratif (form modal & filter daterange) ----------
     Native <input type=date> tidak bisa di-styling isinya di Android/iOS (OS yang gambar
     picker-nya), jadi ikon di kiri ini murni dekoratif tapi konsisten di semua device —
     inilah yang bikin field tanggal terlihat "modern", bukan cuma kotak kosong polos. */
  .date-field-wrap{
    position:relative;display:flex;align-items:center;
    border:1px solid var(--ag-gray-200);border-radius:var(--radius-sm);background:var(--ag-surface);
    transition:border-color .12s ease,box-shadow .12s ease;
  }
  .date-field-wrap:focus-within{border-color:var(--ag-green);box-shadow:0 0 0 3px var(--ag-green-soft);}
  .date-field-wrap svg{width:16px;height:16px;flex-shrink:0;margin-left:11px;color:var(--ag-green);pointer-events:none;}
  .date-field-wrap input[type=date]{
    border:none!important;background:transparent!important;box-shadow:none!important;flex:1;min-width:0;
  }
  .date-field-wrap input[type=date]:focus{background:transparent!important;}
  .date-field-wrap--sm{border-radius:999px;}
  .date-field-wrap--sm svg{width:14px;height:14px;margin-left:12px;}
  .date-field-wrap--sm input[type=date]{padding:7px 10px 7px 8px;font-size:13px;}
  .date-field-wrap.has-placeholder-ghost{position:relative;}
  .date-field-ghost{
    position:absolute;left:37px;top:50%;transform:translateY(-50%);
    font-size:13px;color:var(--ag-gray-400);pointer-events:none;font-weight:500;
  }
  .date-field-wrap--sm .date-field-ghost{left:32px;font-size:12.5px;}
  .filter-daterange{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;}
  .filter-daterange .date-field-wrap--sm{flex:1;min-width:0;}
  @media (max-width: 720px){
    .filter-daterange{flex:1 1 100%;}
  }

  /* ---------- Text field dgn ikon dekoratif di kiri (Promo Code, Promo Name, dst) ---------- */
  .text-field-wrap{
    position:relative;display:flex;align-items:center;
    border:1px solid var(--ag-gray-200);border-radius:var(--radius-sm);background:var(--ag-surface);
    transition:border-color .12s ease,box-shadow .12s ease;
  }
  .text-field-wrap:focus-within{border-color:var(--ag-green);box-shadow:0 0 0 3px var(--ag-green-soft);}
  .text-field-wrap svg{width:15px;height:15px;flex-shrink:0;margin-left:11px;color:var(--ag-green);pointer-events:none;}
  .text-field-wrap input{border:none!important;background:transparent!important;box-shadow:none!important;flex:1;min-width:0;}

  /* ---------- Promo — modern card list (menggantikan tabel supaya tidak ada
     scrollbar horizontal & tidak ada teks terpotong di layar sempit) ---------- */
  .promo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:4px;}
  .promo-card{
    border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);padding:14px;background:var(--ag-surface);
    display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s ease, border-color .15s ease;
  }
  .promo-card:hover{box-shadow:0 4px 14px rgba(20,60,40,.08);border-color:var(--ag-gray-300);}
  .promo-card-top{display:flex;align-items:flex-start;gap:10px;}
  .promo-card-top .badge{flex-shrink:0;white-space:nowrap;margin-top:1px;}
  .promo-card-icon{
    flex-shrink:0;width:38px;height:38px;border-radius:10px;background:var(--ag-green-soft);color:var(--ag-green);
    display:flex;align-items:center;justify-content:center;
  }
  .promo-card-icon svg{width:19px;height:19px;}
  .promo-card-heading{flex:1;min-width:0;}
  .promo-card-name{font-size:14px;font-weight:700;color:var(--ag-gray-900);line-height:1.35;word-break:break-word;}
  .promo-card-code{font-size:11.5px;color:var(--ag-gray-500);font-weight:600;margin-top:2px;}
  .promo-card-desc{
    font-size:12.5px;color:var(--ag-gray-600);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .promo-card-dates{
    display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ag-gray-600);
    background:var(--ag-gray-50);border-radius:8px;padding:7px 10px;
  }
  .promo-card-dates svg{width:14px;height:14px;flex-shrink:0;color:var(--ag-gray-400);}
  .promo-card-actions{display:flex;justify-content:flex-end;gap:6px;padding-top:2px;border-top:1px dashed var(--ag-gray-200);margin-top:2px;padding-top:8px;}
  @media (max-width: 480px){
    .promo-list{grid-template-columns:1fr;}
  }

  /* ---------- Skeleton loading (shimmer) — dipakai saat aksi butuh round-trip server
     (mis. hapus Promo) supaya UI tidak terlihat diam sebelum hasil/toast muncul ---------- */
  .skeleton-box, .skeleton-line{
    background:linear-gradient(90deg, var(--ag-gray-100) 25%, var(--ag-gray-200) 37%, var(--ag-gray-100) 63%);
    background-size:400% 100%; animation:skeleton-shimmer 1.4s ease infinite; border-radius:6px;
  }
  .skeleton-line{height:12px;border-radius:5px;}
  .skeleton-card{pointer-events:none;}
  @keyframes skeleton-shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  /* ---------- Order — card list (senada Promo/PO) ---------- */
  .order-list{display:flex;flex-direction:column;gap:12px;margin-top:4px;}
  .order-card{border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);padding:14px;background:var(--ag-surface);display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s ease,border-color .15s ease;}
  .order-card:hover{box-shadow:0 4px 14px rgba(20,60,40,.08);border-color:var(--ag-gray-300);}
  .order-card-id{font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;font-weight:700;color:var(--ag-gray-900);}
  .order-card-po{font-size:11.5px;color:var(--ag-gray-500);font-weight:600;margin-top:2px;}
  .order-card-field{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
  .order-card-field span{flex-shrink:0;width:52px;color:var(--ag-gray-500);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;}
  .order-card-field b{font-weight:600;color:var(--ag-gray-800);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order-card-sub{font-size:11px;color:var(--ag-gray-500);font-weight:500;white-space:normal;}
  .order-card-sub-inline{color:var(--ag-gray-500);font-weight:500;}
  .order-card-badges{display:flex;flex-wrap:wrap;gap:6px;}
  .order-card-actions{display:flex;justify-content:flex-end;gap:6px;border-top:1px dashed var(--ag-gray-200);padding-top:10px;}

  /* ---------- Transaksi/PO — card list (senada dengan Promo) ---------- */
  .po-list{display:flex;flex-direction:column;gap:12px;margin-top:4px;}
  .po-card{border:1px solid var(--ag-gray-200);border-radius:var(--radius-md);padding:14px;background:var(--ag-surface);display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s ease,border-color .15s ease;}
  .po-card:hover{box-shadow:0 4px 14px rgba(20,60,40,.08);border-color:var(--ag-gray-300);}
  .po-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .po-card-id{font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;font-weight:700;color:var(--ag-gray-900);}
  .po-card-agent-name{font-size:12.5px;font-weight:600;color:var(--ag-gray-700);margin-top:3px;}
  .po-card-agent-sub{font-size:11px;color:var(--ag-gray-500);margin-top:1px;}
  .po-card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;background:var(--ag-gray-50);border-radius:10px;padding:10px 12px;}
  .po-card-field{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .po-card-field span{font-size:10.5px;color:var(--ag-gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .po-card-field b{font-size:12.5px;font-weight:600;color:var(--ag-gray-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .po-card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--ag-gray-200);padding-top:10px;}
  .po-card-total{display:flex;flex-direction:column;gap:2px;}
  .po-card-total span{font-size:10.5px;color:var(--ag-gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .po-card-total b{font-size:15px;font-weight:800;color:var(--ag-green);}
  @media (max-width: 480px){
    .po-card-grid{grid-template-columns:1fr 1fr;}
  }

  /* ---------- Date input modern (dipakai di modal form: Start/End Date, dst) ----------
     Bawaan <input type=date> polos (cuma teks angka), sekarang diberi ikon kalender
     kustom warna hijau brand + focus ring, senada dgn field lain, bukan tampilan default OS. */
  .form-group input[type=date]{
    position:relative;cursor:pointer;
    background-image:none;
  }
  .form-group input[type=date]::-webkit-calendar-picker-indicator{
    cursor:pointer;opacity:.65;padding:2px;border-radius:6px;margin-left:4px;
    filter:invert(38%) sepia(45%) saturate(500%) hue-rotate(90deg) brightness(90%);
    transition:opacity .12s ease,background .12s ease;
  }
  .form-group input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1;background:var(--ag-green-soft);}
  .form-group input[type=date]:focus{background:var(--ag-green-soft);}

  /* ---------- Agent Registration Modal (redesigned) ---------- */
  .reg-overlay{display:none;position:fixed;inset:0;background:rgba(6,20,15,.6);z-index:200;
    align-items:center;justify-content:center;padding:20px;overflow:hidden;backdrop-filter:blur(3px);}
  .reg-overlay.show{display:flex;}
  /* .reg-card is the rounded shell — it does NOT scroll itself, so its border-radius is never
     clipped/cut by a scrollbar track (some browsers, incl. the sandboxed iframe Apps Script
     runs in, render scrollbars outside any radius clipping on the scrolling element itself).
     .reg-card-scroll is a plain rectangular inner wrapper that actually scrolls; the scrollbar
     lives flush against ITS edge, one radius-layer removed from the rounded shell, so the
     white/native bar can never visually slice through the green header's rounded corner. */
  .reg-card{
    background:var(--ag-surface);border-radius:24px;width:100%;max-width:580px;max-height:92vh;
    overflow:hidden;box-shadow:0 32px 80px rgba(6,30,22,.38);animation:modal-in .2s cubic-bezier(.2,.8,.3,1);
    margin:auto;display:flex;flex-direction:column;isolation:isolate;
  }
  .reg-card-scroll{
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;min-height:0;flex:1 1 auto;
    scrollbar-width:thin !important;scrollbar-color:var(--ag-scrollbar-thumb) transparent;scrollbar-gutter:auto;
    background:var(--ag-surface);
  }
  .reg-card-scroll::-webkit-scrollbar{width:4px !important;}
  .reg-card-scroll::-webkit-scrollbar-track{background:transparent;margin:4px 0;}
  .reg-card-scroll::-webkit-scrollbar-thumb{background:var(--ag-scrollbar-thumb);border-radius:99px;background-clip:padding-box;}
  .reg-card-scroll::-webkit-scrollbar-thumb:hover{background:var(--ag-scrollbar-thumb-hover);}
  .reg-hero{
    background:linear-gradient(160deg,#0B3D2E 0%,#155940 50%,#1E7A4C 100%);
    color:#fff;padding:30px 30px 24px;position:relative;overflow:hidden;flex-shrink:0;z-index:2;
    box-shadow:0 6px 16px -6px rgba(6,30,22,.35);
  }
  .reg-hero::before{
    content:'';position:absolute;inset:0;opacity:.5;
    background-image:repeating-linear-gradient(178deg,transparent 0 30px,rgba(255,255,255,.05) 30px 32px);
    mask-image:radial-gradient(circle at 85% 15%, black 0%, transparent 65%);
  }
  .reg-hero::after{
    content:'';position:absolute;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,153,74,.3) 0%, transparent 70%);
    top:-100px;right:-80px;
  }
  .reg-hero-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;}
  .reg-hero-badge{
    display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;margin-bottom:15px;
  }
  .reg-hero-title{font-family:'Fraunces','Georgia',serif;font-size:23px;font-weight:600;margin:0 0 7px;position:relative;z-index:1;letter-spacing:-.01em;}
  .reg-hero-sub{font-size:13px;color:rgba(255,255,255,.85);margin:0;position:relative;z-index:1;line-height:1.55;max-width:420px;}
  .reg-close{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative;z-index:1;
    transition:background .15s;
  }
  .reg-close:hover{background:rgba(255,255,255,.3);}
  .reg-close svg{width:14px;height:14px;}

  .reg-steps{display:flex;gap:8px;position:relative;z-index:1;margin-top:18px;}
  .reg-step-dot{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.25);}
  .reg-step-dot.done{background:var(--ag-orange);}

  .reg-body{padding:28px 30px 8px;}
  .reg-section-title{
    font-size:11px;font-weight:800;color:var(--ag-green);text-transform:uppercase;letter-spacing:.06em;
    margin:0 0 16px;display:flex;align-items:center;gap:9px;
  }
  .reg-section-title:not(:first-child){margin-top:8px;padding-top:22px;border-top:1px dashed var(--ag-gray-200);}
  .reg-section-title .reg-section-num{
    width:21px;height:21px;border-radius:50%;background:var(--ag-green-soft);color:var(--ag-green);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
  }

  /* Document upload tiles with preview */
  .doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .doc-tile{
    position:relative;border:1.5px dashed var(--ag-gray-200);border-radius:14px;background:var(--ag-gray-50);
    padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s, transform .15s;
    min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    isolation:isolate;
  }
  .doc-tile:hover{border-color:var(--ag-green);background:var(--ag-green-soft);transform:translateY(-2px);}
  .doc-tile.has-file{border-style:solid;border-color:var(--ag-green);background:var(--ag-surface);padding:8px;overflow:hidden;}
  .doc-tile input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:2;}
  .doc-tile-icon{width:30px;height:30px;color:var(--ag-gray-400);margin-bottom:8px;}
  .doc-tile-icon svg{width:100%;height:100%;}
  .doc-tile-label{font-size:11.5px;font-weight:700;color:var(--ag-gray-600);line-height:1.3;}
  .doc-tile-hint{font-size:10px;color:var(--ag-gray-400);margin-top:3px;}
  .doc-tile-filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .doc-filelist-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--ag-gray-50);border-radius:8px;font-size:12px;color:var(--ag-gray-900);}
  .doc-filelist-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-filelist-remove{border:none;background:none;color:var(--ag-gray-400);font-size:16px;line-height:1;cursor:pointer;flex-shrink:0;padding:0 2px;}
  .doc-filelist-remove:hover{color:var(--ag-danger,#D64545);}
  .doc-tile-preview{width:100%;height:78px;border-radius:9px;object-fit:cover;margin-bottom:8px;box-shadow:var(--shadow-sm);}
  .doc-tile-preview.sig-preview-checker{
    object-fit:contain;background-color:#FFFFFF;
    background-image:
      linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0px;
  }
  .doc-tile-filename{font-size:10.5px;color:var(--ag-green);font-weight:700;word-break:break-all;padding:0 4px;}
  .doc-tile-check{
    position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ag-green);
    color:#fff;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:var(--shadow-sm);
  }
  .doc-tile-check svg{width:11px;height:11px;}
  .doc-tile-pdf-badge{
    width:100%;height:78px;border-radius:9px;background:var(--ag-red-soft);color:var(--ag-red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:8px;font-size:10px;font-weight:800;
  }
  .doc-tile-pdf-badge svg{width:24px;height:24px;margin-bottom:2px;}

  /* ---- Signature pad (draw-with-cursor) ---- */
  .sig-tabs{display:flex;gap:6px;margin-bottom:10px;background:var(--ag-gray-100);padding:4px;border-radius:var(--radius-sm);}
  .sig-tab{
    flex:1;border:none;background:transparent;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;
    color:var(--ag-gray-600);cursor:pointer;transition:all .15s ease;
  }
  .sig-tab.active{background:var(--ag-surface);color:var(--ag-green);box-shadow:var(--shadow-sm);}
  .sig-pane{width:100%;}
  .sig-canvas{
    width:100%;height:160px;border:2px dashed var(--ag-gray-300);border-radius:var(--radius-sm);
    background:#FFFFFF repeating-linear-gradient(0deg,transparent,transparent 39px,#F0F2F0 40px);
    cursor:crosshair;touch-action:none;display:block;
  }
  .sig-canvas-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
  .sig-canvas-tip{font-size:10.5px;color:var(--ag-gray-400);}

  .reg-footer{
    display:flex;gap:10px;padding:18px 28px 26px;position:sticky;bottom:0;background:var(--ag-surface);
    z-index:10;box-shadow:0 -6px 14px -10px rgba(6,30,22,.25);
  }
  .reg-footer .btn{flex:1;}

  /* Rapikan modal registrasi & field-row-2 di layar sempit (mobile) supaya
     kolom Email / No. Telepon tidak sempit & terpotong seperti di layar lebar. */
  @media (max-width:560px){
    .reg-overlay{padding:0;align-items:flex-end;}
    .reg-card{max-width:100%;max-height:94vh;border-radius:20px 20px 0 0;}
    .reg-hero{padding:22px 20px 18px;}
    .reg-hero-title{font-size:19px;}
    .reg-hero-sub{font-size:12.5px;}
    .reg-body{padding:20px 20px 8px;}
    .reg-footer{padding:14px 20px 20px;}
    .field-row-2{grid-template-columns:1fr;gap:0;}
    .doc-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  }

  /* Success popup */
  .success-overlay{
    display:none;position:fixed;inset:0;background:rgba(6,20,15,.55);z-index:250;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);
  }
  .success-overlay.show{display:flex;}
  .success-card{
    background:var(--ag-surface);border-radius:22px;width:100%;max-width:400px;text-align:center;
    padding:38px 30px 30px;box-shadow:0 30px 70px rgba(6,30,22,.4);animation:success-in .35s cubic-bezier(.2,.9,.3,1.3);
    position:relative;overflow:hidden;
  }
  @keyframes success-in{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .success-check{
    width:78px;height:78px;border-radius:50%;background:var(--ag-green-soft);color:var(--ag-green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
    animation:success-pop .5s cubic-bezier(.34,1.56,.64,1) .1s both;
  }
